[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "store77cam-biaslens"
version = "0.1.0"
description = "按人群或场景分组统计评测结果，标出组间差距与样本量不足的分组。"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "store77cam" }]
keywords = ["bias", "evaluation", "fairness", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://store77cam.github.io"
Repository = "https://github.com/store77cam/biaslens"
Issues = "https://github.com/store77cam/biaslens/issues"

[project.scripts]
biaslens = "biaslens:main"

[tool.setuptools]
py-modules = ["biaslens"]
